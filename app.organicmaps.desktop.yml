app-id: app.organicmaps.desktop
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: OrganicMaps
rename-icon: organicmaps
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --system-talk-name=org.freedesktop.GeoClue2.*
modules:
  - name: organicmaps
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DBUILD_DEV_SANDBOX=OFF
      - -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON
    make-args:
      - desktop
    cleanup:
      - '/lib' # static libraries and build configs
      - '/include'
    sources:
      - type: git
        url: https://github.com/organicmaps/organicmaps
        commit: 3425055d9bce1233ae63a06aff3ada8cec1b80a4
        # The application version counts commits by their UTC date.
        disable-shallow-clone: true
